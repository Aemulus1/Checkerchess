<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schaakfront Deluxe v8</title><style>*{box-sizing:border-box}body{margin:0;background:#10191f;color:#f3e6c7;font-family:system-ui;display:flex;justify-content:center;padding:12px}.app{background:#17232b;width:min(100%,780px);padding:14px;border-radius:14px}h1{text-align:center;color:#f5cb69;margin:4px 0;font-size:clamp(22px,5vw,30px)}.subtitle{text-align:center;letter-spacing:2px;font-size:10px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}button{cursor:pointer}.top button,.bottom button{padding:9px 14px;border-radius:7px;border:1px solid #bd9b64;background:#b58b48;color:#fff;font-weight:700}.play{display:flex;gap:8px;align-items:stretch;justify-content:center}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:calc(100% - 100px);max-width:570px;aspect-ratio:1;border:3px solid #b98c42;border-radius:5px;overflow:hidden}.side{width:92px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}.panel{background:#243740;border:1px solid #b98c42;border-radius:8px;padding:5px;flex:1;min-height:100px}.panel.blue{border-color:#719ab6}.panel-title{text-align:center;font-size:10px;color:#f5cb69;font-weight:800}.blue .panel-title{color:#a9d2ed}.taken{display:flex;flex-direction:column;gap:5px;margin-top:7px}.take-row{display:flex;align-items:center;justify-content:space-between;gap:2px;background:#182a33;border-radius:5px;padding:2px}.take-icon{width:27px;height:29px;flex-shrink:0}.take-count{color:#fff!important;font-size:14px;font-weight:900;text-shadow:0 1px 2px #000}.square{position:relative;display:flex;justify-content:center;align-items:center;aspect-ratio:1;min-width:0;padding:0;border:0;touch-action:manipulation;overflow:hidden}.piece{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.info{text-align:center;font-size:13px;min-height:22px;margin:12px 0}.bottom{text-align:center}.hint{text-align:center;font-size:11px;opacity:.75;margin-top:12px;line-height:1.6}@media(max-width:390px){.app{padding:8px}.play{gap:5px}.side{width:75px}.board{width:calc(100% - 80px)}.panel{padding:3px}.take-icon{width:23px;height:25px}.take-count{font-size:12px}}.credit{margin-top:15px;text-align:center;color:#f5cb69;font-size:12px;font-weight:700;letter-spacing:1.4px;opacity:.9}</style></head><body><main class="app"><h1>♛ SCHAAKFRONT ♛</h1><div class="subtitle">DELUXE V8 · SLAGOVERZICHT</div><div class="top"><span id="status">Jij speelt goud</span><button id="reset">Nieuw spel</button></div><div class="play"><div id="board" class="board" aria-label="Schaakfront speelbord"></div><aside class="side"><div class="panel"><div class="panel-title">GOUD SLAAT</div><div id="gold" class="taken"></div></div><div class="panel blue"><div class="panel-title">BLAUW SLAAT</div><div id="blue" class="taken"></div></div></aside></div><div id="info" class="info">Selecteer een gouden stuk.</div><div class="bottom"><button id="undo">↶ Zet terug</button></div><div class="hint">🔴 Rode stip: vertrek computer · Rode rand: aankomst computer<br>Damstukken: één vak diagonaal of korte sprong</div><footer class="credit">Teekay–Omnia 26</footer></main><script>
(()=>{'use strict';
const board=document.querySelector('#board'),status=document.querySelector('#status'),info=document.querySelector('#info'),goldPanel=document.querySelector('#gold'),bluePanel=document.querySelector('#blue');
const valid=(r,c)=>r>=0&&r<8&&c>=0&&c<8,enemy=s=>s==='w'?'b':'w';
const clone=a=>a.map(row=>row.map(p=>p?{...p}:null));
const value={P:100,D:170,N:320,B:330,R:500,M:650,Q:900,K:100000};
const shapes={
P:'<path d="M22 27C15 21 17 12 25 10C33 12 35 21 28 27L32 36H18Z"/><path d="M16 37H34L38 43H12Z"/><path d="M10 44H40V48H10Z"/>',
R:'<path d="M12 9H19V15H23V9H29V15H33V9H40V20L35 24V38H15V24L10 20V9Z"/><path d="M13 39H37L41 46H9Z"/><path d="M8 46H42V49H8Z"/>',
N:'<path d="M14 44L16 32L10 25L13 15L24 8L34 12L39 22L35 28L27 25L23 32L32 39L35 44Z"/><path d="M18 18L24 16L26 20L20 22Z" fill="#17232b" stroke="none"/><path d="M11 45H39V49H11Z"/>',
B:'<path d="M25 6L30 12L27 17C38 25 33 34 29 37H21C17 34 12 25 23 17L20 12Z"/><path d="M20 22L31 33" fill="none"/><path d="M16 38H34L38 44H12Z"/><path d="M10 45H40V49H10Z"/>',
Q:'<circle cx="9" cy="12" r="4"/><circle cx="19" cy="8" r="4"/><circle cx="31" cy="8" r="4"/><circle cx="41" cy="12" r="4"/><path d="M9 17L15 36H35L41 17L31 27L25 15L19 27Z"/><path d="M14 38H36L39 44H11Z"/><path d="M10 45H40V49H10Z"/>',
K:'<path d="M25 3V17M18 10H32" fill="none" stroke-width="4"/><path d="M19 18L15 25L19 35H31L35 25L31 18Z"/><path d="M16 36H34L38 44H12Z"/><path d="M10 45H40V49H10Z"/>',
D:'<ellipse cx="25" cy="36" rx="19" ry="9"/><path d="M6 30V36C6 42 15 46 25 46S44 42 44 36V30"/><ellipse cx="25" cy="30" rx="19" ry="9"/><path d="M12 30Q25 21 38 30" fill="none" opacity=".5"/>',
M:'<ellipse cx="25" cy="39" rx="19" ry="8"/><path d="M6 33V39C6 45 15 48 25 48S44 45 44 39V33"/><ellipse cx="25" cy="33" rx="19" ry="8"/><path d="M12 27L16 17L22 23L25 12L29 23L35 17L39 27Z"/><circle cx="25" cy="10" r="3"/>'};
function icon(p){const gold=p.s==='w',fill=gold?'#edbd54':'#719ab6',stroke=gold?'#634019':'#223e56',shine=gold?'#fff0a8':'#e5f5ff';return '<svg viewBox="0 0 50 52" width="94%" height="94%" style="overflow:visible;filter:drop-shadow(1px 3px 2px #0008)" aria-hidden="true"><g fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">'+shapes[p.t]+'</g><path d="M18 39H32" stroke="'+shine+'" stroke-width="1.4" opacity=".7" fill="none"/></svg>'}
let a,turn,sel,options,chain,history,lastBlack,busy,over,serial=0,captured;
function reset(){serial++;a=Array.from({length:8},()=>Array(8).fill(null));const row='RNBQKBNR';for(let c=0;c<8;c++){a[0][c]={s:'b',t:row[c]};a[1][c]={s:'b',t:'P'};a[2][c]={s:'b',t:'D'};a[5][c]={s:'w',t:'D'};a[6][c]={s:'w',t:'P'};a[7][c]={s:'w',t:row[c]}}turn='w';sel=null;options=[];chain=false;history=[];lastBlack=null;busy=false;over=false;captured={w:[],b:[]};info.textContent='Selecteer een gouden stuk.';render()}
function raw(z,r,c){const p=z[r][c];if(!p)return[];const moves=[],step=p.s==='w'?-1:1;const add=(y,x,cap=null)=>{if(valid(y,x))moves.push({r:y,c:x,cap})};if(p.t==='D'||p.t==='M'){for(const dy of p.t==='D'?[step]:[-1,1])for(const dx of [-1,1]){const y=r+dy,x=c+dx;if(!valid(y,x))continue;if(!z[y][x])add(y,x);else if(z[y][x].s!==p.s&&z[y][x].t!=='K'&&valid(y+dy,x+dx)&&!z[y+dy][x+dx])add(y+dy,x+dx,[y,x])}return moves}if(p.t==='P'){const y=r+step;if(valid(y,c)&&!z[y][c]){add(y,c);if((p.s==='w'?r===6:r===1)&&valid(y+step,c)&&!z[y+step][c])add(y+step,c)}for(const dx of [-1,1])if(valid(y,c+dx)&&z[y][c+dx]&&z[y][c+dx].s!==p.s&&z[y][c+dx].t!=='K')add(y,c+dx,[y,c+dx]);return moves}const diag=[[1,1],[1,-1],[-1,1],[-1,-1]],straight=[[1,0],[-1,0],[0,1],[0,-1]];const dirs=p.t==='N'?[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]:p.t==='K'?[...diag,...straight]:[...(['B','Q'].includes(p.t)?diag:[]),...(['R','Q'].includes(p.t)?straight:[])];for(const [dy,dx] of dirs)for(let n=1;n<=(p.t==='N'||p.t==='K'?1:7);n++){const y=r+dy*n,x=c+dx*n;if(!valid(y,x))break;if(!z[y][x])add(y,x);else{if(z[y][x].s!==p.s&&z[y][x].t!=='K')add(y,x,[y,x]);break}}return moves}
function attacked(z,r,c,side){for(let y=0;y<8;y++)for(let x=0;x<8;x++){const p=z[y][x];if(!p||p.s!==side||p.t==='D')continue;if(p.t==='P'){if(y+(side==='w'?-1:1)===r&&Math.abs(x-c)===1)return true;continue}if(p.t==='M'){for(const dy of [-1,1])for(const dx of [-1,1]){if(y+dy===r&&x+dx===c)return true;if(y+2*dy===r&&x+2*dx===c&&valid(y+dy,x+dx)&&z[y+dy][x+dx]&&z[y+dy][x+dx].s!==side)return true}continue}if(p.t==='K'){if(Math.max(Math.abs(y-r),Math.abs(x-c))===1)return true;continue}const diag=[[1,1],[1,-1],[-1,1],[-1,-1]],straight=[[1,0],[-1,0],[0,1],[0,-1]];const dirs=p.t==='N'?[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]:[...(['B','Q'].includes(p.t)?diag:[]),...(['R','Q'].includes(p.t)?straight:[])];for(const [dy,dx] of dirs)for(let n=1;n<=(p.t==='N'?1:7);n++){const yy=y+dy*n,xx=x+dx*n;if(!valid(yy,xx))break;if(yy===r&&xx===c)return true;if(z[yy][xx])break}}return false}
function check(z,s){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(z[r][c]?.s===s&&z[r][c].t==='K')return attacked(z,r,c,enemy(s));return true}
function apply(z,r,c,m){const next=clone(z),p=next[r][c];next[r][c]=null;if(m.cap)next[m.cap[0]][m.cap[1]]=null;next[m.r][m.c]=p;if(p.t==='D'&&(m.r===0||m.r===7))p.t='M';if(p.t==='P'&&(m.r===0||m.r===7))p.t='Q';return next}
function legal(z,r,c,s,captureOnly=false){if(z[r][c]?.s!==s)return[];return raw(z,r,c).filter(m=>(!captureOnly||m.cap)&&!check(apply(z,r,c,m),s))}
function all(z,s){const moves=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(z[r][c]?.s===s)for(const m of legal(z,r,c,s))moves.push({r,c,m});return moves}
function score(z){let sum=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=z[r][c];if(!p)continue;let v=value[p.t];if(p.t==='D')v+=(p.s==='b'?r:7-r)*12;if(['N','B','P'].includes(p.t))v+=(3.5-Math.abs(c-3.5))*6;sum+=(p.s==='b'?v:-v)}return sum}
function captureEnds(z,r,c,s,depth=0,taken=[]){if(depth>=8)return[{board:z,r,c,taken}];const ms=legal(z,r,c,s,true);if(!ms.length)return[{board:z,r,c,taken}];let out=[];for(const m of ms){const victim=z[m.cap[0]][m.cap[1]];out.push(...captureEnds(apply(z,r,c,m),m.r,m.c,s,depth+1,[...taken,{...victim}]))}return out}
function outcomes(z,mv,s){const taken=mv.m.cap?[{...z[mv.m.cap[0]][mv.m.cap[1]]}]:[];const next=apply(z,mv.r,mv.c,mv.m);if(mv.m.cap&&['D','M'].includes(z[mv.r][mv.c].t))return captureEnds(next,mv.m.r,mv.m.c,s,0,taken);return[{board:next,r:mv.m.r,c:mv.m.c,taken}]}
function computer(){busy=true;render();const id=++serial;setTimeout(()=>{if(id!==serial||over||turn!=='b')return;const moves=all(a,'b');let best=-Infinity,pick=null;for(const mv of moves)for(const end of outcomes(a,mv,'b')){const replies=all(end.board,'w');let worst=Infinity;if(!replies.length)worst=check(end.board,'w')?100000:0;else for(const reply of replies)for(const result of outcomes(end.board,reply,'w'))worst=Math.min(worst,score(result.board));const v=worst+Math.random()*12;if(v>best){best=v;pick={mv,end}}}if(!pick){busy=false;return}lastBlack={from:[pick.mv.r,pick.mv.c],to:[pick.end.r,pick.end.c]};captured.b.push(...pick.end.taken);a=pick.end.board;busy=false;finish()},70)}
function finish(){sel=null;options=[];chain=false;turn=enemy(turn);const moves=all(a,turn);if(!moves.length){over=true;info.textContent=check(a,turn)?(turn==='w'?'Schaakmat — computer wint!':'Schaakmat — jij wint!'):'Pat — gelijkspel!'}else info.textContent=check(a,turn)?'Schaak!':'';render();if(turn==='b'&&!over)computer()}
function drawCaptures(){const types=['D','M','P','N','B','R','Q'];for(const [panel,side] of [[goldPanel,'w'],[bluePanel,'b']]){panel.innerHTML='';const taken=captured[side];if(!taken.length){panel.innerHTML='<div style="text-align:center;color:white;opacity:.65">—</div>';continue}for(const type of types){const count=taken.filter(p=>p.t===type).length;if(!count)continue;const row=document.createElement('div');row.className='take-row';const pic=document.createElement('div');pic.className='take-icon';pic.innerHTML=icon({s:side==='w'?'b':'w',t:type});const qty=document.createElement('strong');qty.className='take-count';qty.textContent='×'+count;row.append(pic,qty);panel.appendChild(row)}}}
function render(){board.innerHTML='';status.textContent=over?'Partij afgelopen':busy?'Computer denkt…':turn==='w'?'Jij bent aan zet':'Computer aan zet';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=a[r][c],cell=document.createElement('button');cell.className='square';cell.style.background=(r+c)%2?'linear-gradient(145deg,#597384,#354d5d)':'linear-gradient(145deg,#f1e3c4,#bba681)';if(sel&&sel[0]===r&&sel[1]===c)cell.style.background='#dba93d';if(lastBlack&&lastBlack.to[0]===r&&lastBlack.to[1]===c)cell.style.boxShadow='inset 0 0 0 4px #f04444';if(options.some(m=>m.r===r&&m.c===c)){cell.style.boxShadow='inset 0 0 0 3px #39d5a2';if(!p){const d=document.createElement('span');d.style.cssText='position:absolute;width:23%;height:23%;border-radius:50%;background:#24b98c88';cell.appendChild(d)}}if(p){const holder=document.createElement('span');holder.className='piece';holder.innerHTML=icon(p);cell.appendChild(holder)}if(lastBlack&&lastBlack.from[0]===r&&lastBlack.from[1]===c){const dot=document.createElement('span');dot.style.cssText='position:absolute;right:6%;bottom:6%;width:25%;height:25%;border-radius:50%;background:#f04444;border:1px solid white;box-shadow:0 0 4px #991b1b;z-index:2';cell.appendChild(dot)}cell.setAttribute('aria-label',String.fromCharCode(97+c)+(8-r)+(p?' '+p.t:' leeg'));cell.onclick=()=>tap(r,c);board.appendChild(cell)}drawCaptures()}
function tap(r,c){if(over||busy||turn!=='w')return;if(sel){const m=options.find(m=>m.r===r&&m.c===c);if(m){if(!chain)history.push({board:clone(a),last:lastBlack?{from:[...lastBlack.from],to:[...lastBlack.to]}:null,captured:{w:captured.w.map(p=>({...p})),b:captured.b.map(p=>({...p}))}});const type=a[sel[0]][sel[1]].t;if(m.cap)captured.w.push({...a[m.cap[0]][m.cap[1]]});a=apply(a,sel[0],sel[1],m);if(m.cap&&['D','M'].includes(type)){const more=legal(a,r,c,'w',true);if(more.length){sel=[r,c];options=more;chain=true;info.textContent='Meervoudige slag — spring verder!';render();return}}finish();return}}if(chain){info.textContent='Maak de slagcombinatie af.';return}if(a[r][c]?.s==='w'){sel=[r,c];options=legal(a,r,c,'w');info.textContent=options.length?'Kies een groen gemarkeerd vak.':'Geen geldige zet.'}else{sel=null;options=[]}render()}
document.querySelector('#reset').onclick=reset;document.querySelector('#undo').onclick=()=>{if(!history.length)return;serial++;const prev=history.pop();a=prev.board;lastBlack=prev.last;captured=prev.captured;turn='w';sel=null;options=[];chain=false;busy=false;over=false;info.textContent='Vorige beurt teruggenomen.';render()};reset();
})();
</script></body></html>
